<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#46178F" />

    <title>Yahoot — live classroom quiz</title>
    <meta
      name="description"
      content="Host a live quiz on the projector and let the class play along on their phones. Join with a PIN — no account, no install."
    />

    <!-- The icon <link> tags are injected after bundling, by build.ts.
         Bun's HTML bundler tries to resolve an absolute href as a module and
         fails; the same is true of the font, see injectHead() there. -->

    <!-- Social preview. These paths are root-relative on purpose: every school
         runs this on its own domain, so a hard-coded absolute URL would point
         every deployment at somebody else's server. Set PUBLIC_URL at build
         time to rewrite them as absolute (see apps/web/build.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yahoot" />
    <meta property="og:title" content="Yahoot — live classroom quiz" />
    <meta
      property="og:description"
      content="Host a live quiz on the projector and let the class play along on their phones. Join with a PIN — no account, no install."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="694" />
    <meta
      property="og:image:alt"
      content="The Yahoot join screen: a game PIN field on a purple backdrop."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yahoot — live classroom quiz" />
    <meta
      name="twitter:description"
      content="Host a live quiz on the projector and let the class play along on their phones. Join with a PIN — no account, no install."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
